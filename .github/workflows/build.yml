name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch, because drip targets Plasma 6 and Ubuntu's runners do not carry
    # KDE Frameworks 6 development packages. These are the same names the
    # installer suggests, so CI exercises the documented dependency list.
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-tools \
            karchive kconfig kcoreaddons ki18n knotifications kio kwindowsystem

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Install to a staging root
        run: DESTDIR="${PWD}/stage" cmake --install build

      # A missing or malformed QML file is invisible at build time and fatal at
      # runtime. The applet imports dev.drip, so point the linter at the module
      # that was just staged. i18n is injected by Plasma, so unqualified access
      # is disabled rather than reported for every translated string.
      - name: Lint QML
        run: |
          # Qt's tools are not on PATH on Arch.
          qmllint=$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          plugin=$(find stage -name libdripplugin.so | head -1)
          qmlpath=$(dirname "$(dirname "$(dirname "$plugin")")")
          "$qmllint" --unqualified disable \
            -I "$qmlpath" -I applet/contents/ui \
            applet/contents/ui/*.qml applet/contents/config/config.qml

      - name: Check the daemon runs
        run: ./build/bin/dripd --help

      - name: Show what would be installed
        run: find stage -type f | sort
